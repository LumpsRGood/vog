name: Deploy Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push database migrations
        run: supabase db push

      - name: Install database client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Configure Power Automate bridge
        env:
          PGHOST: db.${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co
          PGPORT: 5432
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          POWER_AUTOMATE_SYNC_URL: ${{ secrets.POWER_AUTOMATE_SYNC_URL }}
          SYNC_WEBHOOK_SECRET: ${{ secrets.SYNC_WEBHOOK_SECRET }}
        run: |
          psql "sslmode=require" \
            --set=sync_url="$POWER_AUTOMATE_SYNC_URL" \
            --set=sync_secret="$SYNC_WEBHOOK_SECRET" <<'SQL'
          update public.vog_sync_settings
          set value = :'sync_url',
              updated_at = now()
          where key = 'lists_sync_url';

          update public.vog_sync_settings
          set value = coalesce(:'sync_secret', ''),
              updated_at = now()
          where key = 'lists_sync_secret';
          SQL

      - name: Set function secrets
        run: |
          supabase secrets set \
            MS_TENANT_ID="${{ secrets.MS_TENANT_ID }}" \
            MS_CLIENT_ID="${{ secrets.MS_CLIENT_ID }}" \
            MS_CLIENT_SECRET="${{ secrets.MS_CLIENT_SECRET }}" \
            MS_SITE_HOSTNAME="${{ secrets.MS_SITE_HOSTNAME }}" \
            MS_SITE_PATH="${{ secrets.MS_SITE_PATH }}" \
            POWER_AUTOMATE_SYNC_URL="${{ secrets.POWER_AUTOMATE_SYNC_URL }}" \
            SYNC_WEBHOOK_SECRET="${{ secrets.SYNC_WEBHOOK_SECRET }}"

      - name: Deploy sync function
        run: supabase functions deploy sync-issue-to-lists
