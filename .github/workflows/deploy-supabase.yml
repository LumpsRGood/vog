name: Deploy Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push database migrations
        run: supabase db push

      - name: Set function secrets
        run: |
          supabase secrets set \
            MS_TENANT_ID="${{ secrets.MS_TENANT_ID }}" \
            MS_CLIENT_ID="${{ secrets.MS_CLIENT_ID }}" \
            MS_CLIENT_SECRET="${{ secrets.MS_CLIENT_SECRET }}" \
            MS_SITE_HOSTNAME="${{ secrets.MS_SITE_HOSTNAME }}" \
            MS_SITE_PATH="${{ secrets.MS_SITE_PATH }}" \
            POWER_AUTOMATE_SYNC_URL="${{ secrets.POWER_AUTOMATE_SYNC_URL }}" \
            SYNC_WEBHOOK_SECRET="${{ secrets.SYNC_WEBHOOK_SECRET }}" \
            STAFF_INTAKE_CODE="${{ secrets.STAFF_INTAKE_CODE }}" \
            SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"

      - name: Deploy sync function
        run: supabase functions deploy sync-issue-to-lists

      - name: Deploy staff intake function
        run: supabase functions deploy staff-intake
